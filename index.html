
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJayJoker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #000;
            color: #fff;
        }

        body {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: Georgia, serif;
        }

        /* Symbol [*] */

        .memorial {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            letter-spacing: 5px;
            opacity: 0;
            pointer-events: none;
            animation: memorialFade 7s ease forwards;
        }

        /* Odtwarzacz filmu */

        .video {
            width: 90%;
            max-width: 960px;
            aspect-ratio: 16 / 9;
            opacity: 0;
            visibility: hidden;
            animation: videoFade 4s ease 6s forwards;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Animacje */

        @keyframes memorialFade {
            0% {
                opacity: 0;
            }

            30%, 65% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        @keyframes videoFade {
            0% {
                opacity: 0;
                visibility: visible;
                transform: scale(0.97);
            }

            100% {
                opacity: 1;
                visibility: visible;
                transform: scale(1);
            }
        }

        /* Ukryty przycisk */

        .secret-trigger {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 60px;
            height: 60px;
            z-index: 10;
            background: transparent;
            border: none;
            padding: 0;
            touch-action: manipulation;
        }

        /* Easter Egg */

        .easter-egg {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 1.5s ease,
                        visibility 1.5s;
        }

        .easter-egg.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .easter-egg img {
            max-width: 90vw;
            max-height: 85dvh;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 2s ease,
                        transform 2s ease;
            cursor: pointer;
        }

        .easter-egg.active img {
            opacity: 1;
            transform: scale(1);
        }

        /* Dostępność */

        @media (prefers-reduced-motion: reduce) {
            .memorial {
                display: none;
            }

            .video {
                animation: none;
                opacity: 1;
                visibility: visible;
            }

            .easter-egg,
            .easter-egg img {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <div class="memorial">[*]</div>

    <div class="video">
        <iframe
            src="https://www.youtube-nocookie.com/embed/fAlD0QLE76U?rel=0"
            title="JJayJoker"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>
    </div>

    <!-- Ukryty przycisk -->

    <button
        class="secret-trigger"
        id="secretTrigger"
        aria-label="azirkabo">
    </button>

    <!-- Easter Egg -->

    <div class="easter-egg" id="easterEgg">
        <img src="./x0sh4zx.jpg" alt="azirka">
    </div>

    <script>
        const easterEgg = document.getElementById("easterEgg");
        const secretTrigger = document.getElementById("secretTrigger");

        const secretCode = "azirka";

        let clicks = 0;
        let clickTimer;
        let typed = "";

        function showEasterEgg() {
            easterEgg.classList.add("active");
        }

        function hideEasterEgg() {
            easterEgg.classList.remove("active");
        }

        // Pięć kliknięć w prawy dolny róg

        secretTrigger.addEventListener("click", () => {
            clicks++;

            clearTimeout(clickTimer);

            clickTimer = setTimeout(() => {
                clicks = 0;
            }, 2000);

            if (clicks >= 5) {
                showEasterEgg();
                clicks = 0;
                clearTimeout(clickTimer);
            }
        });

        // Wpisanie sekretnego hasła

        document.addEventListener("keydown", (event) => {

            if (event.key === "Escape") {
                hideEasterEgg();
                typed = "";
                return;
            }

            if (event.key.length === 1) {
                typed += event.key.toLowerCase();
                typed = typed.slice(-secretCode.length);

                if (typed === secretCode) {
                    showEasterEgg();
                    typed = "";
                }
            }
        });

        // Zamknięcie Easter Egga

        easterEgg.addEventListener("click", () => {
            hideEasterEgg();
        });
    </script>

</body>
</html>
