
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJayJoker</title>
    <link rel="icon" type="image/png" href="./czapka.png">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #000;
            color: #fff;
        }

        body {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: Georgia, serif;
        }

        .memorial {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            letter-spacing: 5px;
            opacity: 0;
            pointer-events: none;
            animation: memorialFade 7s ease forwards;
        }

        .video-wrapper {
            position: relative;
            width: 90%;
            max-width: 960px;
        }

        .video {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            opacity: 0;
            visibility: hidden;
            background: #000;
        }

        .video.active {
            visibility: visible;
            animation: videoFade 3s ease forwards;
        }

        .video.corrupted {
            visibility: visible;
            animation: videoCorruption 1.2s linear forwards;
        }

        .video.blackout {
            opacity: 0;
            visibility: hidden;
            animation: none;
        }

        .video.reveal {
            visibility: visible;
            animation: crtStartup 0.6s ease forwards;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }

        .countdown {
            position: absolute;
            top: calc(100% + 25px);
            left: 0;
            width: 100%;
            text-align: center;
            color: #fff;
            font-family: Georgia, serif;
            font-size: clamp(20px, 4vw, 32px);
            letter-spacing: 4px;
            font-variant-numeric: tabular-nums;
            opacity: 0;
            visibility: hidden;
            transition: opacity 3s ease;
        }

        .countdown.active {
            opacity: 1;
            visibility: visible;
        }

        .interference {
            position: fixed;
            inset: 0;
            z-index: 50;
            overflow: hidden;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
        }

        .interference.active {
            visibility: visible;
            animation: interference 1.2s linear forwards;
        }

        .noise {
            position: absolute;
            inset: -30%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.35;
        }

        .interference.active .noise {
            animation: noiseMovement 0.15s steps(3) infinite;
        }

        .scanlines {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 3px,
                rgba(0, 0, 0, 0.5) 4px,
                transparent 6px
            );
        }

        .tracking {
            position: absolute;
            left: 0;
            width: 100%;
            height: 100px;
            top: -100px;
            background: linear-gradient(
                transparent,
                rgba(255, 255, 255, 0.2),
                rgba(255, 255, 255, 0.04),
                transparent
            );
        }

        .interference.active .tracking {
            animation: trackingMovement 1s linear forwards;
        }

        .glitch-bar {
            position: absolute;
            width: 100%;
            height: 18px;
            opacity: 0;
            background: rgba(200, 200, 200, 0.25);
        }

        .bar-one {
            top: 22%;
        }

        .bar-two {
            top: 48%;
            height: 45px;
        }

        .bar-three {
            top: 76%;
            height: 8px;
        }

        .interference.active .glitch-bar {
            animation: barGlitch 1s steps(1) forwards;
        }

        .interference.active .bar-two {
            animation-delay: 0.1s;
        }

        .interference.active .bar-three {
            animation-delay: 0.2s;
        }

        @keyframes memorialFade {
            0% {
                opacity: 0;
            }

            30%, 65% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        @keyframes videoFade {
            from {
                opacity: 0;
                transform: scale(0.97);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes videoCorruption {
            0% {
                opacity: 1;
                transform: none;
                filter: none;
            }

            12% {
                transform: translateX(-5px);
                filter: contrast(1.3);
            }

            25% {
                transform: translateX(12px) skewX(3deg);
                filter: grayscale(0.6)
                        drop-shadow(-5px 0 #ff003c)
                        drop-shadow(5px 0 #00c8ff);
            }

            40% {
                transform: translateX(-18px) scaleY(0.96);
                filter: contrast(1.5) saturate(0.5);
            }

            55% {
                transform: translateX(8px) skewX(-5deg);
                filter: grayscale(1);
                opacity: 0.8;
            }

            70% {
                transform: scaleX(1.04) scaleY(0.8);
                filter: grayscale(1) contrast(1.6);
            }

            85% {
                transform: scaleX(1.1) scaleY(0.05);
                opacity: 0.5;
            }

            100% {
                transform: scaleY(0);
                opacity: 0;
            }
        }

        @keyframes interference {
            0% {
                opacity: 0;
            }

            20% {
                opacity: 0.2;
            }

            45% {
                opacity: 0.45;
            }

            70% {
                opacity: 0.65;
            }

            90% {
                opacity: 0.3;
            }

            100% {
                opacity: 0;
            }
        }

        @keyframes noiseMovement {
            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(-8%, 5%);
            }

            50% {
                transform: translate(5%, -8%);
            }

            75% {
                transform: translate(-5%, -5%);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        @keyframes trackingMovement {
            from {
                top: -100px;
            }

            to {
                top: 110%;
            }
        }

        @keyframes barGlitch {
            0% {
                opacity: 0;
            }

            20% {
                opacity: 0.6;
                transform: translateX(-30px);
            }

            40% {
                opacity: 0.2;
                transform: translateX(25px);
            }

            60% {
                opacity: 0.5;
                transform: translateX(-10px);
            }

            100% {
                opacity: 0;
            }
        }

        @keyframes crtStartup {
            0% {
                opacity: 0;
                transform: scaleX(0.3) scaleY(0.005);
                filter: grayscale(1);
            }

            20% {
                opacity: 1;
                transform: scaleX(1) scaleY(0.01);
            }

            45% {
                transform: scaleX(1.02) scaleY(0.7);
                filter: contrast(1.4) grayscale(0.8);
            }

            70% {
                transform: scaleX(0.99) scaleY(1.01)
                           translateX(-4px);
            }

            85% {
                transform: translateX(3px);
            }

            100% {
                opacity: 1;
                transform: none;
                filter: none;
            }
        }

        .secret-trigger {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 60px;
            height: 60px;
            z-index: 60;
            background: transparent;
            border: none;
            padding: 0;
            touch-action: manipulation;
        }

        .easter-egg {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 1.5s ease,
                        visibility 1.5s;
        }

        .easter-egg.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .easter-egg img {
            max-width: 90vw;
            max-height: 85dvh;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 2s ease,
                        transform 2s ease;
            cursor: pointer;
        }

        .easter-egg.active img {
            opacity: 1;
            transform: scale(1);
        }

        .bell-trigger {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 60px;
            z-index: 60;
            background: transparent;
            border: none;
            padding: 0;
            touch-action: manipulation;
        }

        .bell-resonance {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 55;
        }

        .bell-wave {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vmax;
            height: 150vmax;
            border: 2px solid rgba(255,255,255,.22);
            border-radius: 50%;
            box-shadow:
                0 0 35px rgba(255,255,255,.12),
                inset 0 0 35px rgba(255,255,255,.12);
            opacity: 0;
        }

        .bell-resonance.active .bell-wave {
            animation: bellWave 3.2s ease-out both;
        }

        .bell-resonance.active .bell-wave:nth-child(2) {
            animation-delay: .35s;
        }

        .bell-resonance.active .bell-wave:nth-child(3) {
            animation-delay: .75s;
        }

        .video-wrapper.ringing {
            animation: bellShake 3.2s ease-out both;
        }

        @keyframes bellWave {
            0% {
                transform: translate(-50%, -50%) scale(.03);
                opacity: 0;
            }

            12% {
                opacity: .65;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0;
            }
        }

        @keyframes bellShake {
            0%, 100% {
                transform: none;
            }

            5% {
                transform: translateX(-3px) scale(1.008);
            }

            10% {
                transform: translateX(3px) scale(1.006);
            }

            17% {
                transform: translateX(-2px) scale(1.004);
            }

            25% {
                transform: translateX(2px);
            }

            38% {
                transform: translateX(-1px);
            }

            55% {
                transform: translateX(1px);
            }

            75% {
                transform: none;
            }
        }

        #fredVideo {
            position: fixed;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        
        #fredCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            object-fit: contain;
            z-index: 40;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #fredCanvas.active {
            opacity: 1;
        }

        #fredHat {
            position: absolute;
            left: -85px;
            top: -100px;
            width: clamp(150px, 17vw, 250px);
            aspect-ratio: 4 / 3;
            z-index: 45;
            display: none;
            pointer-events: none;
        }

        #fredHat.active {
            display: block;
        }

        #fredHat img {
            display: block;
            width: 100%;
            height: 100%;
        }

        #fredPin {
            position: absolute;
            left: 40.8%;
            top: 52.8%;
            transform: translate(-50%, -50%);
            width: 9%;
            aspect-ratio: 1;
            border: none;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            pointer-events: auto;
            padding: 0;
        }

        #fredPin:hover,
        #fredPin:focus-visible {
            box-shadow: 0 0 12px white;
        }

        #sobieskiPin {
            position: absolute;
            left: 33.3%;
            top: 53.9%;
            transform: translate(-50%, -50%);
            width: 7%;
            aspect-ratio: 1;
            border: none;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            pointer-events: auto;
            padding: 0;
        }

        #sobieskiPin:hover,
        #sobieskiPin:focus-visible {
            box-shadow: 0 0 12px yellow;
        }

        #sobieskiVideo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            z-index: 30;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.5s ease,
                        visibility 0.5s;
        }

        #sobieskiVideo.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        @media (max-width: 1250px) {
            #fredHat {
                left: -20px;
                top: -75px;
                width: 160px;
            }
        }

        @media (max-height: 650px) {
            .video-wrapper {
                width: min(
                    90vw,
                    calc((100dvh - 120px) * 16 / 9)
                );
            }

            .countdown {
                top: calc(100% + 15px);
                font-size: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .memorial,
            .interference,
            .bell-resonance {
                display: none;
            }

            .video.active,
            .video.reveal {
                animation: none;
                opacity: 1;
                visibility: visible;
            }

            .video.corrupted,
            .video-wrapper.ringing {
                animation: none;
            }

            .easter-egg,
            .easter-egg img,
            .countdown,
            #fredCanvas,
            #sobieskiVideo {
                transition: none;
            }
        }
        #lyricsContainer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 42;
}

.lyric-word {
    position: absolute;
    color: white;
    font-family: Georgia, serif;
    font-weight: bold;
    white-space: nowrap;
    text-shadow:
        0 0 15px rgba(255, 255, 255, 0.4),
        0 0 30px rgba(0, 0, 0, 0.9),
        2px 2px 8px black;

    animation: lyricAppear 1.8s ease forwards;
}

@keyframes lyricAppear {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%)
                   scale(0.5)
                   rotate(var(--rotation));
    }

    20% {
        opacity: 1;
    }

    60% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translate(-50%, -65%)
                   scale(1.5)
                   rotate(var(--rotation));
    }
}
    
        #timeCrack {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 54;
            pointer-events: none;
            opacity: 0;
        }
        #timeCrack.active { animation: crackFade 2.8s ease-out forwards; }
        #countdown.frozen { animation: clockImpact .45s ease-out; text-shadow: 0 0 12px #aaa; }
        @keyframes crackFade {
            0% { opacity: 1; background: rgba(255,255,255,.25); }
            12% { opacity: 1; background: transparent; }
            55% { opacity: .8; }
            100% { opacity: 0; }
        }
        @keyframes clockImpact {
            0%,100% { transform: none; }
            20% { transform: translateX(-4px) scale(1.08); }
            45% { transform: translateX(3px); }
        }
        @media (prefers-reduced-motion: reduce) {
            #timeCrack.active, #countdown.frozen { animation: none; }
        }

        #stageLights {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 35;
            opacity: 0;
            visibility: hidden;
            contain: layout paint;
            transition: opacity .5s ease, visibility .5s;
        }
        #stageLights.active {
            visibility: visible;
            opacity: 1;
            animation: stageIgnition .65s ease-out;
        }
        #stageLights::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 48%, rgba(255,255,255,.08) 0%, transparent 35%, rgba(0,0,0,.48) 100%);
        }
        .stage-beam {
            position: absolute;
            top: -5vh;
            width: 48vw;
            height: 145vh;
            transform-origin: 50% 0%;
            background: linear-gradient(to bottom, rgba(255,255,255,.46), rgba(255,255,255,.20) 45%, rgba(255,255,255,.06) 75%, transparent);
            clip-path: polygon(45% 0%, 55% 0%, 100% 100%, 0% 100%);
            transform: translate3d(0,0,0) rotate(var(--start));
        }
        .beam-one { left: 13%; --start: -25deg; --end: -5deg; --speed: 2s; }
        .beam-two { left: 39%; --start: 25deg; --end: 5deg; --speed: 2.3s; }
        .beam-three { left: -20%; --start: -55deg; --end: -35deg; --speed: 2.6s; }
        .beam-four { left: 72%; --start: 55deg; --end: 35deg; --speed: 2.1s; }
        #stageLights.active .stage-beam {
            will-change: transform;
            animation: beamSweep var(--speed) ease-in-out infinite alternate;
        }
        @keyframes beamSweep {
            from { transform: translate3d(0,0,0) rotate(var(--start)); }
            to { transform: translate3d(0,0,0) rotate(var(--end)); }
        }
        @keyframes stageIgnition {
            0% { opacity: 0; }
            20% { opacity: 1; }
            45% { opacity: .45; }
            100% { opacity: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
            #stageLights.active, #stageLights.active .stage-beam { animation: none; }
        }
    </style>
</head>

<body>

    <div class="memorial">[*]</div>

    <div class="video-wrapper">

        <div class="video" id="videoContainer">
            <iframe
                id="youtubePlayer"
                title="JJayJoker"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
            </iframe>
        </div>

        <video
            id="sobieskiVideo"
            src="./sobieskijjay.mp4"
            playsinline
            preload="metadata">
        </video>

        <div id="stageLights" aria-hidden="true">
        <div class="stage-beam beam-one"></div>
        <div class="stage-beam beam-two"></div>
        <div class="stage-beam beam-three"></div>
        <div class="stage-beam beam-four"></div>
        </div>

        <div id="fredHat">

            <img src="./czapka.png" alt="Kapelusz">

            <button
                id="fredPin"
                aria-label="Fred"
                aria-pressed="false">
            </button>

            <button
                id="sobieskiPin"
                aria-label="Sobieski"
                aria-pressed="false">
            </button>

        </div>

        <div class="countdown" id="countdown">
            00:00:00:00
        </div>

    </div>

    <div class="interference" id="interference">
        <div class="noise"></div>
        <div class="scanlines"></div>
        <div class="tracking"></div>
        <div class="glitch-bar bar-one"></div>
        <div class="glitch-bar bar-two"></div>
        <div class="glitch-bar bar-three"></div>
    </div>

    <div
        class="bell-resonance"
        id="bellResonance"
        aria-hidden="true">

        <div class="bell-wave"></div>
        <div class="bell-wave"></div>
        <div class="bell-wave"></div>

    </div>

    <button
        class="bell-trigger"
        id="bellTrigger"
        aria-label="Dzwon">
    </button>

    <audio
        id="bellSound"
        src="./bell.mp3"
        preload="auto">
    </audio>

    <video
        id="fredVideo"
        src="./fred.mp4"
        loop
        playsinline
        preload="metadata"
        aria-hidden="true">
    </video>

    <div id="lyricsContainer" aria-hidden="true"></div>
    <canvas id="timeCrack" aria-hidden="true"></canvas>

    <canvas
        id="fredCanvas"
        aria-hidden="true">
    </canvas>

    <!-- wpisz azirka -->

    <button
        class="secret-trigger"
        id="secretTrigger"
        aria-label="azirkabo">
    </button>

    <div class="easter-egg" id="easterEgg">
        <img src="./x0sh4zx.jpg" alt="azirka">
    </div>

    <audio
        id="glitchSound"
        src="./glitch%20sfx.mp3"
        preload="auto">
    </audio>

    <script>
        const youtubePlayer = document.getElementById("youtubePlayer");
        const videoContainer = document.getElementById("videoContainer");
        const interference = document.getElementById("interference");
        const easterEgg = document.getElementById("easterEgg");
        const secretTrigger = document.getElementById("secretTrigger");
        const glitchSound = document.getElementById("glitchSound");
        const countdown = document.getElementById("countdown");

        const firstVideo = "fAlD0QLE76U";
        const secondVideo = "I1hvlCCx2jI";

        const firstVideoDuration = 10000;
        const secretCode = "azirka";

        const targetDate = new Date(
            "2026-12-06T00:00:00+01:00"
        ).getTime();

        glitchSound.volume = 0.7;

        let glitchStarted = false;

        document.addEventListener("click", () => {
            if (glitchStarted) return;

            glitchSound.muted = true;

            glitchSound.play().then(() => {
                if (!glitchStarted) {
                    glitchSound.pause();
                    glitchSound.currentTime = 0;
                }

                glitchSound.muted = false;

            }).catch(() => {
                glitchSound.muted = false;
            });

        }, { once: true });

        const reducedMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        ).matches;

        const bellSound = document.getElementById("bellSound");
        const bellTrigger = document.getElementById("bellTrigger");
        const bellResonance = document.getElementById("bellResonance");
        const videoWrapper = document.querySelector(".video-wrapper");

        bellSound.volume = 0.7;

        let bellTimer;
        let lastHour = null;
        let timeFrozen = false;

        function ringBell() {
            bellSound.pause();
            bellSound.currentTime = 0;

            bellSound.play().catch(error => {
                console.warn("Bell audio:", error);
            });

            bellResonance.classList.remove("active");
            videoWrapper.classList.remove("ringing");

            void bellResonance.offsetWidth;

            bellResonance.classList.add("active");
            videoWrapper.classList.add("ringing");

            clearTimeout(bellTimer);

            bellTimer = setTimeout(() => {
                bellResonance.classList.remove("active");
                videoWrapper.classList.remove("ringing");
            }, 4100);
        }

        bellTrigger.addEventListener("click", ringBell);

        function updateCountdown() {
            if (timeFrozen) return;
            const remaining = Math.max(
                0,
                targetDate - Date.now()
            );

            const totalSeconds = Math.ceil(remaining / 1000);

            const hourBucket = Math.ceil(
                remaining / 3600000
            );

            if (
                lastHour !== null &&
                hourBucket < lastHour &&
                countdown.classList.contains("active")
            ) {
                ringBell();
            }

            lastHour = hourBucket;

            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor(totalSeconds / 3600) % 24;
            const minutes = Math.floor(totalSeconds / 60) % 60;
            const seconds = totalSeconds % 60;

            countdown.textContent = [
                days,
                hours,
                minutes,
                seconds
            ].map(n => String(n).padStart(2, "0")).join(":");
        }

        const fredVideo = document.getElementById("fredVideo");
        const fredCanvas = document.getElementById("fredCanvas");
        const fredHat = document.getElementById("fredHat");
        const fredPin = document.getElementById("fredPin");

        const sobieskiPin = document.getElementById("sobieskiPin");
        const sobieskiVideo = document.getElementById("sobieskiVideo");

        const fredContext = fredCanvas.getContext("2d", {
            willReadFrequently: true
        });

        let activeEasterEgg = null;
        let playbackGeneration = 0;

        let youtubeMutedBefore = false;
        let youtubeMuted = false;

        function youtubeCommand(func, args = []) {
            youtubePlayer.contentWindow?.postMessage(
                JSON.stringify({
                    event: "command",
                    func,
                    args
                }),
                "https://www.youtube-nocookie.com"
            );
        }

        let youtubeVolumeApplied = false;

        window.addEventListener("message", event => {
            if (
                event.origin !== "https://www.youtube-nocookie.com" ||
                event.source !== youtubePlayer.contentWindow
            ) {
                return;
            }

            try {
                const data = typeof event.data === "string"
                    ? JSON.parse(event.data)
                    : event.data;

                if (!youtubeVolumeApplied && (data?.event === "onReady" || data?.event === "initialDelivery" || data?.event === "infoDelivery")) {
                    youtubeCommand("setVolume", [40]);
                    youtubeVolumeApplied = true;
                }

                if (typeof data?.info?.muted === "boolean") {
                    youtubeMuted = data.info.muted;
                }

            } catch (_) {}
        });

        youtubePlayer.addEventListener("load", () => {
            youtubeVolumeApplied = false;
            youtubePlayer.contentWindow?.postMessage(
                JSON.stringify({
                    event: "listening",
                    id: "youtubePlayer"
                }),
                "https://www.youtube-nocookie.com"
            );
            youtubeCommand("setVolume", [40]);
        });

        function stopEasterEgg(restoreYoutube = true) {
            const wasActive = activeEasterEgg !== null;
            if (activeEasterEgg === "sobieski") resumeTime();

            playbackGeneration++;

            activeEasterEgg = null;

            fredVideo.pause();
            fredCanvas.classList.remove("active");

            sobieskiVideo.pause();
            sobieskiVideo.classList.remove("active");

            fredPin.setAttribute("aria-pressed", "false");
            sobieskiPin.setAttribute("aria-pressed", "false");

            if (restoreYoutube && wasActive) {
                youtubeCommand(
                    youtubeMutedBefore ? "mute" : "unMute"
                );
            }
        }

        function renderFred(generation) {
            if (
                activeEasterEgg !== "fred" ||
                generation !== playbackGeneration
            ) {
                return;
            }

            if (fredVideo.readyState >= 2) {
                fredContext.drawImage(
                    fredVideo,
                    0,
                    0,
                    fredCanvas.width,
                    fredCanvas.height
                );

                const frame = fredContext.getImageData(
                    0,
                    0,
                    fredCanvas.width,
                    fredCanvas.height
                );

                const pixels = frame.data;

                for (let i = 0; i < pixels.length; i += 4) {
                    const r = pixels[i];
                    const g = pixels[i + 1];
                    const b = pixels[i + 2];

                    const difference = b - Math.max(r, g);

                    const isBlue =
                        b > 65 &&
                        b > r * 1.2 &&
                        b > g * 1.05;

                    const isCyan =
                        b > 80 &&
                        g > 65 &&
                        b > r * 1.3 &&
                        g > r * 1.15;

                    if (isBlue || isCyan) {
                        pixels[i + 3] = 0;

                    } else if (difference > 10) {
                        pixels[i + 3] = Math.round(
                            255 * (
                                1 - Math.min(
                                    1,
                                    (difference - 10) / 35
                                )
                            )
                        );

                        pixels[i + 2] = Math.min(
                            b,
                            Math.max(r, g) + 10
                        );
                    }
                }

                fredContext.putImageData(frame, 0, 0);

                fredCanvas.classList.add("active");
            }

            if ("requestVideoFrameCallback" in fredVideo) {
                fredVideo.requestVideoFrameCallback(() => {
                    renderFred(generation);
                });

            } else {
                requestAnimationFrame(() => {
                    renderFred(generation);
                });
            }
        }

        async function toggleEasterEgg(type) {
            if (activeEasterEgg === type) {
                stopEasterEgg();
                return;
            }

            if (activeEasterEgg === null) {
                youtubeMutedBefore = youtubeMuted;
            }

            stopEasterEgg(false);

            activeEasterEgg = type;

            const generation = ++playbackGeneration;

            youtubeCommand("mute");

            try {
                if (type === "fred") {
                    fredPin.setAttribute(
                        "aria-pressed",
                        "true"
                    );

                    fredVideo.muted = false;
                    fredVideo.volume = 0.4;

                    await fredVideo.play();

                    if (
                        activeEasterEgg !== "fred" ||
                        generation !== playbackGeneration
                    ) {
                        return;
                    }

                    const scale = Math.min(
                        1,
                        1280 / fredVideo.videoWidth
                    );

                    fredCanvas.width = Math.max(
                        1,
                        Math.round(fredVideo.videoWidth * scale)
                    );

                    fredCanvas.height = Math.max(
                        1,
                        Math.round(fredVideo.videoHeight * scale)
                    );

                    renderFred(generation);
                }

                if (type === "sobieski") {
                    sobieskiPin.setAttribute(
                        "aria-pressed",
                        "true"
                    );

                    sobieskiVideo.muted = false;
                    sobieskiVideo.volume = 0.4;
                    sobieskiVideo.currentTime = 0;

                    await sobieskiVideo.play();

                    if (
                        activeEasterEgg !== "sobieski" ||
                        generation !== playbackGeneration
                    ) {
                        return;
                    }

                    sobieskiVideo.classList.add("active");
                }

            } catch (error) {
                if (generation !== playbackGeneration) {
                    return;
                }

                stopEasterEgg();

                console.warn("Video playback:", error);
            }
        }

        fredPin.addEventListener("click", () => {
            toggleEasterEgg("fred");
        });

        sobieskiPin.addEventListener("click", () => {
            toggleEasterEgg("sobieski");
        });

        function showCountdown() {
            updateCountdown();

            countdown.classList.add("active");
            fredHat.classList.add("active");
        }

        updateCountdown();

        setInterval(updateCountdown, 1000);

        function loadVideo(videoID) {
            youtubeVolumeApplied = false;
            youtubePlayer.src =
                "https://www.youtube-nocookie.com/embed/" +
                videoID +
                "?rel=0&autoplay=1&mute=0&playsinline=1&enablejsapi=1" +
                (
                    location.origin !== "null"
                        ? "&origin=" + encodeURIComponent(location.origin)
                        : ""
                );
        }

        function startFirstVideo() {
            loadVideo(firstVideo);

            videoContainer.classList.add("active");

            setTimeout(
                startGlitch,
                firstVideoDuration
            );
        }

        function startGlitch() {
            glitchStarted = true;

            if (reducedMotion) {
                loadVideo(secondVideo);
                showCountdown();
                return;
            }

            glitchSound.muted = false;
            glitchSound.currentTime = 0;

            glitchSound.play().catch(error => {
                console.warn("Glitch audio:", error);
            });

            videoContainer.classList.remove("active");
            videoContainer.classList.add("corrupted");

            interference.classList.add("active");

            setTimeout(() => {
                videoContainer.classList.remove("corrupted");
                videoContainer.classList.add("blackout");

                interference.classList.remove("active");

                youtubePlayer.src = "about:blank";
            }, 1200);

            setTimeout(() => {
                loadVideo(secondVideo);
            }, 1500);

            setTimeout(() => {
                videoContainer.classList.remove("blackout");
                videoContainer.classList.add("reveal");

                glitchSound.pause();
                glitchSound.currentTime = 0;

                showCountdown();
            }, 2000);
        }

        setTimeout(
            startFirstVideo,
            reducedMotion ? 0 : 6000
        );

        let clicks = 0;
        let clickTimer;
        let typed = "";

        function showEasterEgg() {
            easterEgg.classList.add("active");
        }

        function hideEasterEgg() {
            easterEgg.classList.remove("active");
        }

        secretTrigger.addEventListener("click", () => {
            clicks++;

            clearTimeout(clickTimer);

            clickTimer = setTimeout(() => {
                clicks = 0;
            }, 2000);

            if (clicks >= 5) {
                showEasterEgg();

                clicks = 0;

                clearTimeout(clickTimer);
            }
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                hideEasterEgg();
                stopEasterEgg();

                typed = "";

                return;
            }

            if (event.key.length === 1) {
                typed += event.key.toLowerCase();

                typed = typed.slice(-secretCode.length);

                if (typed === secretCode) {
                    showEasterEgg();

                    typed = "";
                }
            }
        });

        easterEgg.addEventListener("click", () => {
            hideEasterEgg();
        });

        const lyricsContainer = document.getElementById("lyricsContainer");

const lyrics = [
    [3.5, "Sobieski i JJay razem znów,"],
    [6.0, "Tym razem w krainie snów."],

    [8.0, "Tak więc posłuchajcie teraz historii."],
    [11.0, "Jako dziecko błądziłem w pytań mgle,"],
    [13.0, "Zastanawiając się"],
    [15.0, "Czemu pada śnieg?"],
    [16.0, "Czemu życie jest złe?"],
    [17.5, "Czemu wszystko jest inne we śnie?"],

    [22.0, "W krainie snów znów się zanurzam."],

    [36.0, "Niech jej blask olśni wiarę w świat"],

    [75.0, "Uwielbiam go."]
];

const timedWords = [];

lyrics.forEach(([startTime, line], index) => {
    const words = line.split(/\s+/);

    const nextTime = lyrics[index + 1]
        ? lyrics[index + 1][0]
        : startTime + 2;

    const duration = nextTime - startTime;

    const wordInterval = Math.min(
        0.30,
        duration / words.length
    );

    words.forEach((word, wordIndex) => {
        timedWords.push({
            time: startTime + wordIndex * wordInterval,
            text: word
        });
    });
});

let lyricIndex = 0;
let lyricsAnimation = null;
let previousLyricTime = 0;


function resumeTime() {
    if (!timeFrozen) return;
    timeFrozen = false;
    lastHour = null;
    countdown.classList.remove("frozen");
    updateCountdown();
}

function freezeTime() {
    if (timeFrozen) return;
    updateCountdown();
    timeFrozen = true;
    countdown.classList.add("frozen");
    if (reducedMotion) return;

    const canvas = document.getElementById("timeCrack");
    const ctx = canvas.getContext("2d");
    const w = canvas.width = window.innerWidth;
    const h = canvas.height = window.innerHeight;
    const rect = countdown.getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top + rect.height / 2;
    const radius = Math.hypot(w, h);
    const rays = [];
    const count = 14;
    for (let i = 0; i < count; i++) {
        const angle = i * Math.PI * 2 / count + (Math.random() - .5) * .3;
        const points = [[x, y]];
        for (let j = 1; j <= 7; j++) {
            const r = radius * Math.pow(j / 7, 1.5);
            const a = angle + (Math.random() - .5) * .14;
            points.push([x + Math.cos(a) * r, y + Math.sin(a) * r]);
        }
        rays.push(points);
    }
    function draw(points, width, opacity) {
        ctx.beginPath();
        points.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py));
        ctx.lineWidth = width + 2;
        ctx.strokeStyle = "rgba(0,0,0,.65)";
        ctx.stroke();
        ctx.lineWidth = width;
        ctx.strokeStyle = `rgba(235,245,255,${opacity})`;
        ctx.stroke();
    }
    rays.forEach(points => draw(points, 1.2, .85));
    for (let i = 0; i < count; i++) {
        for (let j = 1; j <= 4; j++) {
            if (Math.random() < .25) continue;
            const a = rays[i][j];
            const b = rays[(i + 1) % count][j];
            draw([a, [(a[0]+b[0])/2 + (Math.random()-.5)*18, (a[1]+b[1])/2 + (Math.random()-.5)*18], b], .7, .65);
        }
    }
    canvas.classList.add("active");
}

function spawnLyricWord(word) {
    const element = document.createElement("span");

    element.className = "lyric-word";
    element.textContent = word;

    const x = 15 + Math.random() * 70;
    const y = 10 + Math.random() * 80;
    const rotation = -12 + Math.random() * 24;
    const fontSize = 24 + Math.random() * 36;

    element.style.left = x + "%";
    element.style.top = y + "%";

    element.style.fontSize =
        `clamp(18px, 5vw, ${fontSize}px)`;

    element.style.setProperty(
        "--rotation",
        rotation + "deg"
    );

    lyricsContainer.appendChild(element);

    element.addEventListener("animationend", () => {
        element.remove();
    }, { once: true });
}

function updateLyrics() {
    if (
        activeEasterEgg !== "sobieski" ||
        sobieskiVideo.paused
    ) {
        stopLyrics();
        return;
    }

    const currentTime = sobieskiVideo.currentTime;
    setStageLights(currentTime >= 65.4 && currentTime < 109);
    if (Number.isFinite(sobieskiVideo.duration) && currentTime >= sobieskiVideo.duration - 3) {
        resumeTime();
    }
    if (currentTime >= 32.6 && previousLyricTime < 32.6 && currentTime < sobieskiVideo.duration - 3) {
        freezeTime();
    }

    if (currentTime < previousLyricTime) {
        lyricIndex = 0;
        lyricsContainer.replaceChildren();
    }

    previousLyricTime = currentTime;

    while (
        lyricIndex < timedWords.length &&
        currentTime >= timedWords[lyricIndex].time
    ) {
        if (
            currentTime - timedWords[lyricIndex].time < 0.5
        ) {
            spawnLyricWord(
                timedWords[lyricIndex].text
            );
        }

        lyricIndex++;
    }

    lyricsAnimation = requestAnimationFrame(updateLyrics);
}

function startLyrics() {
    stopLyrics();

    lyricIndex = 0;
    previousLyricTime = 0;

    lyricsAnimation = requestAnimationFrame(updateLyrics);
}

const stageLights = document.getElementById("stageLights");
let stageLightsEnabled = false;

function setStageLights(enabled) {
    if (stageLightsEnabled === enabled) return;
    stageLightsEnabled = enabled;
    stageLights.classList.toggle("active", enabled);
}

function stopLyrics() {
    setStageLights(false);
    cancelAnimationFrame(lyricsAnimation);

    lyricsAnimation = null;

    lyricsContainer.replaceChildren();
}

sobieskiVideo.addEventListener("playing", startLyrics);
sobieskiVideo.addEventListener("pause", stopLyrics);
sobieskiVideo.addEventListener("ended", () => {
    stopLyrics();
    if (activeEasterEgg === "sobieski") stopEasterEgg();
});
