
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJAYJOKER</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(
                ellipse at center,
                #261518,
                #0b0b0d 75%
            );
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        h1 {
            font-size: clamp(28px, 6vw, 72px);
            letter-spacing: 8px;
            margin: 0 0 20px;
            text-align: center;
        }

        .line {
            width: 60px;
            height: 3px;
            background: #b83939;
            margin-bottom: 40px;
        }

        .video {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 80px #0008;
            border: 1px solid #333;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }

        .youtube-button {
            margin-top: 25px;
            padding: 12px 24px;
            background: #b83939;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .youtube-button:hover {
            background: #e04444;
        }

        footer {
            margin-top: 35px;
            color: #777;
            font-size: 12px;
            letter-spacing: 3px;
        }
    </style>
</head>

<body>

    

    <div class="line"></div>

    <div class="video">
        <iframe
            src="https://www.youtube-nocookie.com/embed/fAlD0QLE76U"
            title="JJayJoker"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>
    </div>



    <footer>JJAYJOKER.PL — 2026</footer>

</body>
</html>
