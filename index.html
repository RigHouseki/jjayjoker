
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJayJoker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #000;
            color: #fff;
        }

        body {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: Georgia, serif;
        }

        /* Symbol [*] */

        .memorial {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 48px;
            letter-spacing: 5px;
            opacity: 0;

            pointer-events: none;
            animation: memorialFade 7s ease forwards;
        }

        /* Odtwarzacz filmu */

        .video {
            width: 90%;
            max-width: 960px;
            aspect-ratio: 16 / 9;

            opacity: 0;
            visibility: hidden;

            animation: videoFade 4s ease 6s forwards;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Pojawianie i znikanie symbolu */

        @keyframes memorialFade {
            0% {
                opacity: 0;
            }

            30% {
                opacity: 1;
            }

            65% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        /* Powolne pojawianie się filmu */

        @keyframes videoFade {
            0% {
                opacity: 0;
                visibility: visible;
                transform: scale(0.97);
            }

            100% {
                opacity: 1;
                visibility: visible;
                transform: scale(1);
            }
        }

        /* Dostępność */

        @media (prefers-reduced-motion: reduce) {
            .memorial {
                display: none;
            }

            .video {
                animation: none;
                opacity: 1;
                visibility: visible;
            }
        }
    </style>
</head>

<body>

    <div class="memorial">[*]</div>

    <div class="video">
        <iframe
            src="https://www.youtube-nocookie.com/embed/fAlD0QLE76U?rel=0"
            title="JJayJoker"
            allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
